<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { background: white; font-family: sans-serif; padding: 20px; }
  </style>
</head>
<body>
  <p id="status">Loading Turnstile script...</p>

  <script>
    // Manually load the script and report success/failure
    var s = document.createElement('script');
    s.src = 'https://challenges.cloudflare.com/turnstile/v1/api.js';
    s.onload = function() {
      document.getElementById('status').innerText = 'Script loaded! Rendering widget...';

      var div = document.createElement('div');
      div.className = 'cf-turnstile';
      div.setAttribute('data-sitekey', '1x00000000000000000000AA');
      div.setAttribute('data-theme', 'light');
      document.body.appendChild(div);

      if (window.turnstile) {
        window.turnstile.render(div);
        document.getElementById('status').innerText = 'Widget rendered!';
      } else {
        document.getElementById('status').innerText = 'turnstile object not found after script load';
      }
    };
    s.onerror = function() {
      document.getElementById('status').innerText = 'FAILED to load Cloudflare script!';
    };
    document.head.appendChild(s);
  </script>
</body>
</html>
